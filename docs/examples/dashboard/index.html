<!doctype html>
<html lang="en" data-wa-theme="yamabuki">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - iroha-css Demo</title>
    <link rel="stylesheet" href="../../dist/iroha.css" />
    <link rel="stylesheet" href="../../assets/demo.css" />
  </head>
  <body>
    <header class="wa-container wa-nav demo-example-nav">
      <strong>Daily overview</strong>
      <a href="../../">Back to demo</a>
    </header>
    <main class="wa-section">
      <div class="wa-container wa-stack wa-space-6">
        <section class="wa-grid" aria-label="Metrics">
          <article class="wa-card"><p class="wa-text-muted">Orders</p><h2>128</h2></article>
          <article class="wa-card"><p class="wa-text-muted">Response</p><h2>94%</h2></article>
          <article class="wa-card"><p class="wa-text-muted">Queue</p><h2>17</h2></article>
        </section>
        <section class="wa-card wa-flow">
          <h2>Notes</h2>
          <p>Operational screens should stay dense, quiet, and easy to scan.</p>
        </section>
      </div>
    </main>
  </body>
</html>
