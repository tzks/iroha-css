<!doctype html>
<html lang="en" data-wa-theme="kurenai">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product - iroha-css Demo</title>
    <link rel="stylesheet" href="../../dist/iroha.css" />
    <link rel="stylesheet" href="../../assets/demo.css" />
  </head>
  <body>
    <header class="wa-container wa-nav demo-example-nav">
      <a href="../../">iroha-css demos</a>
      <a href="../dashboard/">Next example</a>
    </header>
    <main>
      <section class="wa-section">
        <div class="wa-container wa-product">
          <div class="wa-split">
            <div class="wa-stack">
              <span class="wa-badge">New release</span>
              <h1 class="wa-hero__title">A CSS kit for calmer product pages.</h1>
              <p class="wa-text-muted">Designed for AI agents that need practical structure without visual noise.</p>
            </div>
            <form class="wa-card wa-form" aria-label="Request access">
              <label class="wa-field">Email <input class="wa-input" type="email" required /></label>
              <button class="wa-button" type="submit">Request access</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
